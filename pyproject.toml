[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NexusExplorer"
version = "0.5.0"
license = { text = "MIT" }

requires-python = ">=3.12"

dependencies = [
    "numpy==2.1.1",
    "PyQt6==6.8.1",
    "PyQt6-Qt6==6.8.2",
    "PyQt6_sip==13.10.0",
    "PyOpenGL==3.1.9",
    "Pillow==11.1.0",
    "trimesh==4.6.6",
    "scikit-learn==1.6.1",
    "pyperclip==1.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
nexus_explorer = "nexus_explorer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_explorer"]
